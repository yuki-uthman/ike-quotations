<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ike Quotations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  /* An author display rule outranks the UA stylesheet's [hidden]{display:none},
     so .detail{display:flex} would otherwise render every row expanded. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: #f4f7f6;
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) { body { background: #0b1614; } }

  /* Same neutrals as ike-sales / ike-today. The accent is the one thing that
     differs: amber reads "awaiting", where sales is banked teal. */
  .app {
    --bg: #f4f7f6; --surface: #ffffff; --muted: #edf2f0; --ink: #0d1f1c; --ink2: #4c5f5b; --ink3: #7c8c88;
    --border: rgba(13,31,28,0.08); --rule: #e8edeb; --grid: #e1e6e4;
    --accent: #9a5b12; --accent-soft: rgba(154,91,18,0.12);
    --order: #2f5f8c; --order-soft: rgba(47,95,140,0.12);
    --warn: #8c2f2f; --warn-soft: rgba(140,47,47,0.10);
    --shadow: 0 1px 2px rgba(13,31,28,0.05), 0 12px 32px -16px rgba(13,31,28,0.22);
    min-height: 100vh;
    background: var(--bg); color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    .app {
      --bg: #0b1614; --surface: #11201d; --muted: #162622; --ink: #f2f6f5; --ink2: #b7c6c2; --ink3: #82938e;
      --border: rgba(255,255,255,0.08); --rule: #1e2d2a; --grid: #223330;
      --accent: #e0a458; --accent-soft: rgba(224,164,88,0.14);
      --order: #7fb0de; --order-soft: rgba(127,176,222,0.14);
      --warn: #e08585; --warn-soft: rgba(224,133,133,0.12);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 32px -16px rgba(0,0,0,0.6);
    }
  }

  .shell { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 28px; width: 100%; max-width: 1160px; margin: 0 auto; }

  /* The All pill sits outside the scroller, so the day pills slide under it. */
  .pillbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .allpill { flex: 0 0 auto; position: relative; z-index: 2; }
  .pillswrap { position: relative; flex: 1; min-width: 0; }
  .pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; scroll-padding-left: 8px; }
  .pills::-webkit-scrollbar { display: none; }
  .fade { position: absolute; top: 0; bottom: 0; left: -4px; width: 40px; background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 30%, rgba(244,247,246,0) 100%); pointer-events: none; transition: opacity 0.25s; opacity: 0; }
  @media (prefers-color-scheme: dark) { .fade { background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 30%, rgba(11,22,20,0) 100%); } }
  .pill { flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; font-family: "Source Sans 3", system-ui, sans-serif; font-weight: 600; font-size: 13px; line-height: 1; cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .daterow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 2px 2px 0; }
  .dayname { font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; line-height: 1.15; }
  .daydate { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .stamp { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }

  .hero { padding: 18px 18px 14px; display: flex; flex-direction: column; }
  .total { display: flex; align-items: baseline; gap: 8px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .cur { font-size: 15px; font-weight: 700; color: var(--ink2); letter-spacing: 0.02em; }
  .subline { font-size: 13.5px; color: var(--ink3); margin-top: 8px; font-variant-numeric: tabular-nums; }

  .chart { display: flex; align-items: stretch; gap: 10px; height: 160px; margin-top: 18px; }
  .axis { position: relative; flex: 0 0 32px; margin-bottom: 27px; }
  .axis span { position: absolute; right: 0; transform: translateY(-50%); font-size: 10.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .plot { position: relative; flex: 1; min-width: 0; display: flex; align-items: stretch; gap: 5px; }
  .gridlines { position: absolute; left: 0; right: 0; top: 0; bottom: 27px; pointer-events: none; }
  .gridlines i { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); }
  .bar { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; cursor: pointer; border: 0; background: none; padding: 0; font: inherit; }
  .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .barcol { flex: 1; display: flex; align-items: flex-end; justify-content: center; }
  .barfill { width: 72%; max-width: 28px; min-height: 2px; border-radius: 5px 5px 2px 2px; background: var(--accent); transition: height 340ms cubic-bezier(0.2,0.8,0.2,1), opacity 200ms ease; }
  .barlbl { height: 27px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--ink3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .barlbl .disc { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #ffffff; font-weight: 700; font-size: 12px; }

  .content { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }

  .cardhead { padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .kind { display: inline-flex; align-items: center; gap: 8px; font-family: Manrope, sans-serif; font-weight: 700; font-size: 14px; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
  .count { font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .cardtotal { display: flex; align-items: baseline; gap: 7px; margin-top: 4px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .cardtotal .cur { font-size: 12.5px; font-weight: 700; color: var(--ink3); letter-spacing: 0.03em; }

  .rows { padding: 6px 8px 10px; }
  .item + .item > .row { box-shadow: inset 0 1px 0 var(--rule); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 11px; width: 100%; font: inherit; color: inherit; background: none; border: 0; text-align: left; cursor: pointer; }
  .row:hover, .row[aria-expanded="true"] { background: var(--muted); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .whotop { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .ref { flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .cust { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink3); flex-wrap: wrap; }
  .meta .sep { opacity: 0.5; }
  .tag { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; }
  .tag.part { background: var(--accent-soft); color: var(--accent); }
  .tag.expired { background: var(--warn-soft); color: var(--warn); }
  .amtwrap { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .amt { font-family: Manrope, sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .amtof { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .chev { flex: 0 0 auto; color: var(--ink3); transition: transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1), color 200ms ease; }
  .row[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--accent); }

  /* Animating to a content height nothing has measured: the wrapper is a grid
     whose single row goes 0fr -> 1fr, which interpolates, unlike height:auto. */
  .detailwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms cubic-bezier(0.45, 0, 0.7, 0.25); }
  .detailwrap.open { grid-template-rows: 1fr; transition: grid-template-rows 420ms cubic-bezier(0.34, 1.4, 0.64, 1); }
  .detailclip { overflow: hidden; min-height: 0; }
  .detail { margin: 2px 10px 8px; padding: 10px 12px 10px; background: var(--muted); border-radius: 11px; display: flex; flex-direction: column; gap: 5px; opacity: 0; transform: translateY(-8px); transition: opacity 150ms ease, transform 260ms cubic-bezier(0.5, -0.2, 0.75, 0.4); }
  .detailwrap.open .detail { opacity: 1; transform: none; transition: opacity 200ms ease 30ms, transform 480ms cubic-bezier(0.34, 1.5, 0.64, 1); }
  /* Listed last so it outranks the .open rules above at equal specificity. */
  .detailwrap.instant, .detailwrap.instant .detail { transition: none; }

  .lhead { display: flex; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink3); padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .lrow { display: flex; gap: 12px; font-size: 13px; align-items: baseline; }
  .lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
  .lqty { flex: 0 0 46px; text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .ltot { flex: 0 0 76px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

  .detailfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 7px; padding-top: 9px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .by { font-size: 11.5px; color: var(--ink3); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .drop { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--ink2); border-radius: 9px; padding: 6px 11px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s; }
  .drop:hover { color: var(--warn); border-color: var(--warn); }
  .drop:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
  .drop .x { font-size: 14px; line-height: 1; }

  .empty { padding: 26px 18px; text-align: center; color: var(--ink3); font-size: 14px; }

  .binbar { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 14px; background: var(--muted); border: 1px solid var(--border); font-size: 13.5px; color: var(--ink2); flex-wrap: wrap; }
  .binbar b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .linkbtn { margin-left: auto; border: 0; background: none; color: var(--accent); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .binlist { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
  .binrow { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; }
  .binrow + .binrow { box-shadow: inset 0 1px 0 var(--rule); }
  .binrow .cust { font-weight: 600; font-size: 13.5px; }
  .binrow .amt { font-size: 13.5px; }

  .state-msg { margin: 60px auto; max-width: 420px; text-align: center; color: var(--ink2); font-size: 14.5px; padding: 24px; }

  @keyframes rise-a { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise-b { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    /* !important rather than out-specificing .detailwrap.open and
       .detailwrap.open .detail separately - a motion opt-out should not be one
       selector away from being silently outranked again. */
    .item { animation: none !important; }
    .chev, .detailwrap, .detail, .barfill { transition: none !important; }
    .detail { opacity: 1; transform: none; }
  }

  @media (min-width: 900px) {
    .shell { padding: 30px 40px 40px; gap: 20px; }
    .content { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .dayname { font-size: 26px; }
    .daydate { font-size: 14px; }
    .hero { padding: 26px 28px 20px; }
    .total { font-size: 56px; }
    .cur { font-size: 19px; }
    .chart { height: 210px; margin-top: 22px; }
    .plot { gap: 8px; }
    .cardhead { padding: 20px 24px 14px; }
    .cardtotal { font-size: 34px; }
    .row { padding: 11px 14px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="shell" id="shell">
    <div class="pillbar" id="pillbar">
      <button class="pill allpill" id="allpill" type="button">All</button>
      <div class="pillswrap">
        <div class="pills" id="pills"></div>
        <div class="fade" id="fade"></div>
      </div>
    </div>

    <div class="daterow">
      <div>
        <div class="dayname" id="dayname">&nbsp;</div>
        <div class="daydate" id="daydate">&nbsp;</div>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>

    <div class="card hero" id="hero">
      <div class="total"><span class="cur">MVR</span><span id="heroValue">0</span></div>
      <div class="subline" id="subline"></div>
      <div class="chart" id="chartWrap"></div>
    </div>

    <div class="content" id="content"></div>
    <div id="bin"></div>
  </div>
</div>

<script>
(function () {
  var DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  var DATA_URL = 'https://raw.githubusercontent.com/yuki-uthman/ike-data/main/data/quotations.json';
  var REFRESH_MS = 60000; // ike-data itself refreshes every 15 min; this just keeps the page honest
  var STORE_KEY = 'ike-quotations:dismissed';

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function compact(n) {
    if (n < 1000) return fmt(n);
    var k = n / 1000;
    return (Math.round(k * 10) / 10).toString().replace(/\.0$/, '') + 'k';
  }
  function niceCeil(n) {
    var exp = Math.pow(10, Math.floor(Math.log10(n)));
    var f = n / exp, steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) { if (steps[i] >= f) return steps[i] * exp; }
    return 10 * exp;
  }
  // Odoo carries the internal reference inside the product name: "[PP9] PAPER PLATE 9"".
  function stripCode(name) { return String(name).replace(/^\[[^\]]*\]\s*/, '').trim(); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function parseDay(s) { return new Date(s + 'T00:00:00Z'); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

  // ---- Dismissals. Browser-local by design: Odoo is never touched, and a
  // dismissal made here is invisible to any other device. Every access is
  // guarded - a private window or blocked site data throws on read. ----
  var dismissed = {};
  function loadDismissed() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return {};
      var arr = JSON.parse(raw), out = {};
      if (Object.prototype.toString.call(arr) === '[object Array]') {
        arr.forEach(function (ref) { out[ref] = true; });
      }
      return out;
    } catch (e) { return {}; }
  }
  function saveDismissed() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(Object.keys(dismissed))); } catch (e) {}
  }

  var payload = null;
  var state = { day: null, showBin: false, cw: 322, tick: 0 };
  var chartWindowKey = null, builtDayKey = null, ro = null;

  var pillsEl = document.getElementById('pills');
  var allPillEl = document.getElementById('allpill');
  var fadeEl = document.getElementById('fade');
  var daynameEl = document.getElementById('dayname');
  var daydateEl = document.getElementById('daydate');
  var stampEl = document.getElementById('stamp');
  var heroValueEl = document.getElementById('heroValue');
  var sublineEl = document.getElementById('subline');
  var chartWrapEl = document.getElementById('chartWrap');
  var contentEl = document.getElementById('content');
  var binEl = document.getElementById('bin');

  function live() {
    return (payload.quotations || []).filter(function (q) { return !dismissed[q.ref]; });
  }
  function binned() {
    return (payload.quotations || []).filter(function (q) { return dismissed[q.ref]; });
  }
  function selected() {
    var rows = live();
    if (!state.day) return rows;
    return rows.filter(function (q) { return q.date === state.day; });
  }
  // Day totals are recomputed from the live rows rather than read from the
  // feed, so dismissing a lead updates its bar and its day total immediately.
  function dayTotals() {
    var byDay = {};
    live().forEach(function (q) {
      if (!q.date) return;
      var t = byDay[q.date] || (byDay[q.date] = { count: 0, outstanding: 0 });
      t.count++; t.outstanding += q.outstanding;
    });
    return (payload.days || []).map(function (d) {
      var t = byDay[d.date] || { count: 0, outstanding: 0 };
      return { date: d.date, count: t.count, outstanding: t.outstanding };
    });
  }
  function sum(rows) { return rows.reduce(function (s, q) { return s + q.outstanding; }, 0); }

  // ---- Pills ----
  function buildPills() {
    pillsEl.innerHTML = (payload.days || []).map(function (d) {
      var dt = parseDay(d.date);
      var label = d.date === todayKey() ? 'Today' : DAYN[dt.getUTCDay()].slice(0, 3) + ' ' + dt.getUTCDate();
      return '<button class="pill" type="button" data-day="' + d.date + '">' + escapeHtml(label) + '</button>';
    }).join('');
    requestAnimationFrame(function () {
      try { pillsEl.scrollLeft = pillsEl.scrollWidth; } catch (e) {}
      syncFade();
    });
  }
  function todayKey() {
    var days = payload.days || [];
    return days.length ? days[days.length - 1].date : null;
  }
  function syncFade() { fadeEl.style.opacity = pillsEl.scrollLeft > 2 ? '1' : '0'; }
  function updatePills() {
    var totals = {};
    dayTotals().forEach(function (d) { totals[d.date] = d.count; });
    allPillEl.style.background = state.day ? 'var(--surface)' : 'var(--accent)';
    allPillEl.style.color = state.day ? 'var(--ink2)' : '#ffffff';
    allPillEl.style.boxShadow = state.day ? '0 1px 2px rgba(13,31,28,0.06)' : '0 6px 14px -6px rgba(0,0,0,0.35)';
    Array.prototype.forEach.call(pillsEl.querySelectorAll('.pill'), function (btn) {
      var day = btn.getAttribute('data-day');
      var active = day === state.day;
      btn.style.background = active ? 'var(--accent)' : 'var(--surface)';
      btn.style.color = active ? '#ffffff' : (totals[day] ? 'var(--ink2)' : 'var(--ink3)');
      btn.style.boxShadow = active ? '0 6px 14px -6px rgba(0,0,0,0.35)' : '0 1px 2px rgba(13,31,28,0.06)';
    });
    if (state.day) {
      var active = pillsEl.querySelector('[data-day="' + state.day + '"]');
      if (active) {
        try {
          pillsEl.scrollTo({ left: Math.max(0, active.offsetLeft - pillsEl.clientWidth / 2 + active.offsetWidth / 2), behavior: 'smooth' });
        } catch (e) {}
      }
    }
  }

  // ---- Chart. Rebuilds markup only when the WINDOW of days changes; picking a
  // different day, or dismissing a row, patches heights in place so the bars
  // animate rather than snapping. ----
  function computeBars() {
    var days = dayTotals();
    // "All" means all: the whole span is drawn, bars shrinking to fit, so the
    // chart and the total above it always describe the same set of records.
    // A picked day gets a readable window around it instead.
    var comfortable = Math.max(5, Math.floor(state.cw / 34));
    var win = days;
    if (state.day && days.length > comfortable) {
      var idx = 0;
      for (var i = 0; i < days.length; i++) { if (days[i].date === state.day) idx = i; }
      var first = Math.min(Math.max(0, idx - Math.floor(comfortable / 2)), days.length - comfortable);
      win = days.slice(first, first + comfortable);
    }
    var peak = niceCeil(Math.max(1, Math.max.apply(null, win.map(function (d) { return d.outstanding; }))));
    // Too many bars to label every one: thin the labels rather than let them
    // collide, always keeping the first, the last and the selected day.
    var every = Math.ceil(win.length / comfortable);
    return {
      peak: peak,
      gap: win.length > 16 ? 2 : (win.length > 11 ? 3 : 5),
      bars: win.map(function (d, i) {
        var labelled = every <= 1 || i % every === 0 || i === win.length - 1 || d.date === state.day;
        return {
          date: d.date,
          label: labelled ? String(parseDay(d.date).getUTCDate()) : '',
          h: Math.max(0, d.outstanding / peak * 100),
          sel: !state.day || d.date === state.day
        };
      })
    };
  }
  function renderChart() {
    var c = computeBars();
    var key = c.bars.map(function (b) { return b.date; }).join(',') + '|' + c.peak + '|' + c.gap;
    var plot = document.getElementById('chartPlot');
    if (!plot || key !== chartWindowKey) {
      chartWrapEl.innerHTML =
        '<div class="axis"><span style="top:0">' + compact(c.peak) + '</span>' +
        '<span style="top:50%">' + compact(c.peak / 2) + '</span><span style="top:100%">0</span></div>' +
        '<div class="plot" id="chartPlot" style="gap:' + c.gap + 'px"><div class="gridlines"><i style="top:0"></i><i style="top:50%"></i><i style="bottom:0"></i></div>' +
        c.bars.map(function (b) {
          var dt = parseDay(b.date);
          var title = DAYN[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()];
          return '<button class="bar" type="button" data-day="' + b.date + '" aria-label="' + escapeHtml(title) + '">' +
            '<div class="barcol"><div class="barfill"></div></div>' +
            '<div class="barlbl"></div></button>';
        }).join('') + '</div>';
      chartWindowKey = key;
      attachChartObserver();
      plot = document.getElementById('chartPlot');
      // Paint from zero on a fresh window so the first render grows in.
      requestAnimationFrame(function () { paintBars(c); });
      return;
    }
    paintBars(c);
  }
  function paintBars(c) {
    var plot = document.getElementById('chartPlot');
    if (!plot) return;
    plot.style.gap = c.gap + 'px';
    c.bars.forEach(function (b) {
      var el = plot.querySelector('.bar[data-day="' + b.date + '"]');
      if (!el) return;
      var fill = el.querySelector('.barfill');
      fill.style.height = b.h + '%';
      fill.style.opacity = b.sel ? 1 : 0.3;
      el.querySelector('.barlbl').innerHTML = (state.day && b.date === state.day)
        ? '<span class="disc">' + b.label + '</span>' : b.label;
    });
  }
  function attachChartObserver() {
    if (ro) { try { ro.disconnect(); } catch (e) {} ro = null; }
    var plot = document.getElementById('chartPlot');
    if (!plot || typeof ResizeObserver === 'undefined') return;
    ro = new ResizeObserver(function (entries) {
      var r = entries[0] && entries[0].contentRect;
      if (r && r.width > 0 && Math.abs(r.width - state.cw) > 1) {
        state.cw = r.width;
        chartWindowKey = null;
        renderChart();
      }
    });
    ro.observe(plot);
  }

  // ---- Rows ----
  var rowSeq = 0;
  function lineHtml(l) {
    return '<div class="lrow">' +
      '<span class="lname">' + escapeHtml(stripCode(l.name)) + '</span>' +
      '<span class="lqty">' + (Math.round(l.qty * 100) / 100) + '</span>' +
      '<span class="ltot">' + fmt(l.total) + '</span>' +
      '</div>';
  }
  function ageText(q) {
    var today = todayKey();
    if (!q.date || !today) return '';
    var n = daysBetween(parseDay(q.date), parseDay(today));
    if (n <= 0) return 'today';
    if (n === 1) return 'yesterday';
    return n + ' days ago';
  }
  function expiryTag(q) {
    if (q.kind !== 'quotation' || !q.expires) return '';
    var today = todayKey();
    if (!today) return '';
    var n = daysBetween(parseDay(today), parseDay(q.expires));
    if (n < 0) return '<span class="tag expired">Expired</span>';
    if (n <= 7) return '<span class="tag expired">Expires in ' + n + 'd</span>';
    return '';
  }
  function rowHtml(q, i, animClass) {
    var id = 'lines-' + (++rowSeq);
    var lines = q.lines || [];
    var dt = q.date ? parseDay(q.date) : null;
    var dateLabel = dt ? dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()].slice(0, 3) : '—';
    var part = q.settled > 0
      ? '<span class="sep">·</span><span class="tag part">Part paid</span>' : '';
    var expiry = expiryTag(q);
    var meta = '<div class="meta"><span>' + escapeHtml(dateLabel) + '</span>' +
      '<span class="sep">·</span><span>' + escapeHtml(ageText(q)) + '</span>' + part +
      (expiry ? '<span class="sep">·</span>' + expiry : '') + '</div>';

    var head = '<button class="row" type="button" aria-expanded="false" aria-controls="' + id + '" data-ref="' + escapeHtml(q.ref) + '">' +
      '<span class="who">' +
        '<span class="whotop"><span class="ref">' + escapeHtml(q.ref) + '</span>' +
        '<span class="cust">' + escapeHtml(q.customer || 'No customer') + '</span></span>' +
        meta +
      '</span>' +
      '<span class="amtwrap"><span class="amt">' + fmt(q.outstanding) + '</span>' +
        (q.settled > 0 ? '<span class="amtof">of ' + fmt(q.total) + '</span>' : '') +
      '</span>' +
      '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg>' +
      '</button>';

    var body = lines.length
      ? '<div class="lhead"><span class="lname">Product</span><span class="lqty">Qty</span><span class="ltot">Total</span></div>' + lines.map(lineHtml).join('')
      : '<div class="lrow"><span class="lname">No product lines on this record.</span></div>';

    var detail = '<div class="detailwrap" id="' + id + '" aria-hidden="true"><div class="detailclip"><div class="detail">' +
      body +
      '<div class="detailfoot">' +
        '<span class="by">' + (q.salesperson ? 'Raised by ' + escapeHtml(q.salesperson) : '&nbsp;') + '</span>' +
        '<button class="drop" type="button" data-drop="' + escapeHtml(q.ref) + '">Not interested <span class="x" aria-hidden="true">×</span></button>' +
      '</div>' +
      '</div></div></div>';

    var style = animClass
      ? ' style="animation: ' + animClass + ' 300ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + (Math.min(i, 12) * 30) + 'ms"'
      : '';
    return '<div class="item"' + style + '>' + head + detail + '</div>';
  }

  function cardHtml(title, swatch, rows, animClass) {
    var n = rows.length;
    var body = n
      ? rows.map(function (q, i) { return rowHtml(q, i, animClass); }).join('')
      : '<div class="empty">Nothing open here' + (state.day ? ' on this day' : '') + '.</div>';
    return '<div class="card">' +
      '<div class="cardhead">' +
        '<div class="headrow">' +
          '<span class="kind"><span class="swatch" style="background:' + swatch + '"></span>' + title + '</span>' +
          '<span class="count">' + n + (n === 1 ? ' record' : ' records') + '</span>' +
        '</div>' +
        '<div class="cardtotal"><span class="cur">MVR</span><span>' + fmt(sum(rows)) + '</span></div>' +
      '</div>' +
      '<div class="rows">' + body + '</div>' +
      '</div>';
  }

  function renderBin() {
    var rows = binned();
    if (!rows.length) { binEl.innerHTML = ''; state.showBin = false; return; }
    var html = '<div class="binbar"><span><b>' + rows.length + '</b> dismissed' +
      ' — hidden here only, still open in Odoo.</span>' +
      '<button class="linkbtn" type="button" id="binToggle">' + (state.showBin ? 'Hide' : 'Show') + '</button></div>';
    if (state.showBin) {
      html += '<div class="card" style="margin-top:10px"><div class="rows"><div class="binlist">' +
        rows.map(function (q) {
          var dt = q.date ? parseDay(q.date) : null;
          return '<div class="binrow">' +
            '<span class="ref">' + escapeHtml(q.ref) + '</span>' +
            '<span class="cust">' + escapeHtml(q.customer || 'No customer') + '</span>' +
            '<span class="meta">' + (dt ? dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()].slice(0, 3) : '—') + '</span>' +
            '<span class="amt">' + fmt(q.outstanding) + '</span>' +
            '<button class="linkbtn" type="button" data-restore="' + escapeHtml(q.ref) + '" style="margin-left:0">Restore</button>' +
            '</div>';
        }).join('') +
        '</div></div></div>';
    }
    binEl.innerHTML = html;
  }

  function render(animate) {
    var rows = selected();
    var quotes = rows.filter(function (q) { return q.kind === 'quotation'; });
    var orders = rows.filter(function (q) { return q.kind === 'order'; });
    var byValue = function (a, b) { return b.outstanding - a.outstanding; };
    quotes.sort(byValue); orders.sort(byValue);

    if (state.day) {
      var dt = parseDay(state.day);
      daynameEl.textContent = DAYN[dt.getUTCDay()];
      daydateEl.textContent = dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()] + ' ' + dt.getUTCFullYear();
    } else {
      var days = payload.days || [];
      daynameEl.textContent = 'Still open';
      if (days.length) {
        var a = parseDay(days[0].date), b = parseDay(days[days.length - 1].date);
        daydateEl.textContent = a.getUTCDate() + ' ' + MON[a.getUTCMonth()].slice(0, 3) +
          ' – ' + b.getUTCDate() + ' ' + MON[b.getUTCMonth()].slice(0, 3) + ' ' + b.getUTCFullYear();
      } else { daydateEl.textContent = ''; }
    }

    heroValueEl.textContent = fmt(sum(rows));
    sublineEl.textContent = rows.length + (rows.length === 1 ? ' record' : ' records') +
      ' still owing · ' + quotes.length + ' quotation' + (quotes.length === 1 ? '' : 's') +
      ' · ' + orders.length + ' unpaid order' + (orders.length === 1 ? '' : 's');

    renderChart();
    updatePills();

    var open = openRowKeys();
    var animClass = animate ? ((++state.tick) % 2 ? 'rise-b' : 'rise-a') : null;
    rowSeq = 0;
    contentEl.innerHTML =
      cardHtml('Quotations', 'var(--accent)', quotes, animClass) +
      cardHtml('Unpaid orders', 'var(--order)', orders, animClass);
    restoreOpen(open);
    renderBin();
  }

  // A refresh every 60s must not slam shut a row the user is reading, so
  // remember which rows were open by their reference, not by position.
  function openRowKeys() {
    var keys = {};
    Array.prototype.forEach.call(contentEl.querySelectorAll('.row[aria-expanded="true"]'), function (row) {
      keys[row.getAttribute('data-ref')] = true;
    });
    return keys;
  }
  function restoreOpen(keys) {
    Array.prototype.forEach.call(contentEl.querySelectorAll('.row'), function (row) {
      if (keys[row.getAttribute('data-ref')]) setExpanded(row, true, true);
    });
  }
  function setExpanded(row, open, instant) {
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    var wrap = document.getElementById(row.getAttribute('aria-controls'));
    if (!wrap) return;
    // Reopening a row after a refresh must not replay the animation, so skip
    // the transition for one frame, then hand it back for the next real click.
    if (instant) {
      wrap.classList.add('instant');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { wrap.classList.remove('instant'); });
      });
    }
    wrap.classList.toggle('open', open);
    wrap.setAttribute('aria-hidden', open ? 'false' : 'true');
  }

  // ---- Interaction ----
  function selectDay(day) {
    state.day = day;
    render(true);
  }
  allPillEl.addEventListener('click', function () { selectDay(null); });
  pillsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.pill');
    if (btn) selectDay(btn.getAttribute('data-day'));
  });
  pillsEl.addEventListener('scroll', syncFade);
  chartWrapEl.addEventListener('click', function (e) {
    var bar = e.target.closest('.bar');
    if (!bar) return;
    var day = bar.getAttribute('data-day');
    selectDay(day === state.day ? null : day);
  });
  contentEl.addEventListener('click', function (e) {
    var drop = e.target.closest('[data-drop]');
    if (drop) {
      dismissed[drop.getAttribute('data-drop')] = true;
      saveDismissed();
      render(false);
      return;
    }
    var row = e.target.closest('.row');
    if (row) setExpanded(row, row.getAttribute('aria-expanded') !== 'true');
  });
  binEl.addEventListener('click', function (e) {
    if (e.target.closest('#binToggle')) { state.showBin = !state.showBin; renderBin(); return; }
    var restore = e.target.closest('[data-restore]');
    if (restore) {
      delete dismissed[restore.getAttribute('data-restore')];
      saveDismissed();
      render(false);
    }
  });

  // ---- Boot ----
  function showMessage(msg) {
    document.getElementById('shell').innerHTML = '<div class="state-msg">' + escapeHtml(msg) + '</div>';
  }

  function load(isRefresh) {
    return fetch(DATA_URL, { cache: 'no-store' })
      .then(function (res) {
        if (res.status === 404) throw new Error('not-yet');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var first = payload === null;
        payload = data;
        if (data.generatedAt) {
          var g = new Date(data.generatedAt);
          if (!isNaN(g.getTime())) {
            stampEl.innerHTML = '<span class="dot"></span>updated ' +
              g.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Indian/Maldives' });
          }
        }
        if (first) dismissed = loadDismissed();
        var dayKey = (data.days || []).map(function (d) { return d.date; }).join(',');
        if (dayKey !== builtDayKey) {
          if (state.day && dayKey.indexOf(state.day) === -1) state.day = null; // it fell out of the feed
          builtDayKey = dayKey;
          buildPills();
        }
        chartWindowKey = null;
        render(first);
      })
      .catch(function (err) {
        if (isRefresh) return;
        if (err.message === 'not-yet') {
          showMessage('No quotation data yet — run the “Refresh sales + expenses + today + quotations data” workflow in ike-data once to seed it.');
        } else {
          showMessage('Could not load open quotations (' + err.message + '). Try refreshing in a minute.');
        }
      });
  }

  load(false);
  setInterval(function () { load(true); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) load(true);
  });
})();
</script>
</body>
</html>
